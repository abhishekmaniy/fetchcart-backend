name: Build, Push Backend Image, and Update Infra Repo

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  NODE_VERSION: 20
  INFRA_OVERLAY_IMAGE_PATCH: apps/fetchcart-backend/overlays/production/patch-image.yaml

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: Production

    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    permissions:
      contents: read

    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v4

      - name: Setup Node.js for CI checks
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build check
        run: npm run build

      # Enable later when lint is stable
      # - name: Run lint
      #   run: npm run lint

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate AWS/ECR variables
        run: |
          test -n "${{ secrets.AWS_REGION }}" || (echo "AWS_REGION is missing" && exit 1)
          test -n "${{ secrets.ECR_REPOSITORY }}" || (echo "ECR_REPOSITORY is missing" && exit 1)
          echo "AWS region and ECR repository are configured"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if it does not exist
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ secrets.ECR_REPOSITORY }}" \
            --region "${{ secrets.AWS_REGION }}" \
          || aws ecr create-repository \
            --repository-name "${{ secrets.ECR_REPOSITORY }}" \
            --image-scanning-configuration scanOnPush=true \
            --image-tag-mutability MUTABLE \
            --region "${{ secrets.AWS_REGION }}"

      - name: Prepare Docker image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="main-${SHORT_SHA}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG}"
          LATEST_URI="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest"

          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "latest_uri=${LATEST_URI}" >> $GITHUB_OUTPUT

          echo "Image tag: ${IMAGE_TAG}"
          echo "Image URI: ${IMAGE_URI}"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image_uri }}" \
            -t "${{ steps.meta.outputs.latest_uri }}" \
            .

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.meta.outputs.image_uri }}"
          docker push "${{ steps.meta.outputs.latest_uri }}"

      - name: Show pushed image
        run: |
          echo "Pushed image:"
          echo "${{ steps.meta.outputs.image_uri }}"

  update-infra:
    name: Update Kubernetes Overlay Image
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: Production

    permissions:
      contents: read

    steps:
      - name: Validate infra repo variables
        run: |
          test -n "${{ secrets.INFRA_REPO }}" || (echo "INFRA_REPO is missing" && exit 1)
          test -n "${{ secrets.INFRA_REPO_PAT }}" || (echo "INFRA_REPO_PAT is missing" && exit 1)
          echo "Infra repo configuration is present"

      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update image in production overlay
        working-directory: infra
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          yq eval-all -i '
            (
              select(.kind == "Deployment" and .metadata.name == "fetchcart-api")
              .spec.template.spec.containers[]
              | select(.name == "api").image
            ) = strenv(IMAGE_URI)

            |

            (
              select(.kind == "Deployment" and .metadata.name == "fetchcart-search-worker")
              .spec.template.spec.containers[]
              | select(.name == "search-worker").image
            ) = strenv(IMAGE_URI)

            |

            (
              select(.kind == "Deployment" and .metadata.name == "fetchcart-compare-worker")
              .spec.template.spec.containers[]
              | select(.name == "compare-worker").image
            ) = strenv(IMAGE_URI)
          ' apps/fetchcart-backend/overlays/production/patch-image.yaml

          echo "Updated patch-image.yaml:"
          cat apps/fetchcart-backend/overlays/production/patch-image.yaml

      - name: Commit and push infra update
        working-directory: infra
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          git config user.name "fetchcart-ci-bot"
          git config user.email "fetchcart-ci-bot@users.noreply.github.com"

          if git diff --quiet; then
            echo "No infra changes detected"
            exit 0
          fi

          git add "${{ env.INFRA_OVERLAY_IMAGE_PATCH }}"
          git commit -m "chore(fetchcart-backend): deploy ${IMAGE_TAG}"
          git push

          echo "Infra repo updated with image:"
          echo "${IMAGE_URI}"